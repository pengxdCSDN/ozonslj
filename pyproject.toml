[project]
name = "ozonslj-backend"
version = "0.1.0"
description = "Local-first backend for the Ozon seller operations extension"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pypdf>=5,<6",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
ozonslj-sync-scheduler = "backend.app.sync_runtime:scheduler_main"
ozonslj-sync-worker = "backend.app.sync_runtime:worker_main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend.app"]
