name: Publish ozonslj Web

on:
  push:
    branches:
      - codex/deployment-base-images
    paths:
      - extension/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ozonslj-web-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 8.148.215.217
  DEPLOY_USER: root
  REMOTE_DEPLOY_DIR: /opt/ozonslj/app/deploy

jobs:
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.0.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend typecheck
        run: pnpm typecheck

      - name: Build frontend Web bundle
        run: pnpm --dir extension exec vite build --mode web --configLoader runner --outDir ../web-release-ci --emptyOutDir

      - name: Prepare SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/ozonslj_server
          chmod 600 ~/.ssh/ozonslj_server
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Web bundle to isolated directory
        shell: bash
        run: |
          remote="${REMOTE_DEPLOY_DIR}/web.next-${GITHUB_SHA}"
          ssh -i ~/.ssh/ozonslj_server "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "rm -rf '${remote}' && mkdir -p '${remote}'"
          scp -i ~/.ssh/ozonslj_server -r web-release-ci/. \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote}/"

      - name: Deploy Web bundle only
        shell: bash
        run: |
          ssh -i ~/.ssh/ozonslj_server "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_SHA='${GITHUB_SHA}' REMOTE_DEPLOY_DIR='${REMOTE_DEPLOY_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DEPLOY_DIR"
          rollback="web.rollback-${DEPLOY_SHA}"
          if [ -d web ]; then mv web "$rollback"; fi
          mv "web.next-${DEPLOY_SHA}" web
          docker compose --env-file .env up -d --force-recreate --no-deps web
          REMOTE

      - name: Verify Web bundle and HTTPS
        shell: bash
        run: |
          ssh -i ~/.ssh/ozonslj_server "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_DEPLOY_DIR='${REMOTE_DEPLOY_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DEPLOY_DIR"
          test -s web/index.html
          for asset in $(grep -oE '/assets/[^" ]+' web/index.html); do
            test -s "web${asset}"
          done
          curl --fail --silent --show-error https://127.0.0.1/ >/dev/null --insecure
          curl --fail --silent --show-error https://127.0.0.1/api/health/ready >/dev/null --insecure
          REMOTE
