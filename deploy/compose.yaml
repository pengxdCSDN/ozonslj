name: ozonslj

x-app-common: &app-common
  image: ${REGISTRY_PREFIX}/pxd:${APP_IMAGE_TAG}
  restart: unless-stopped
  environment:
    APP_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DATABASE: ozonslj
    POSTGRES_USER: ozonslj
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # 旧单工作区数据在受控迁移中归入该内部组织；客户端不得选择或覆盖此边界。
    DEFAULT_ORGANIZATION_ID: legacy-bootstrap
    OZON_CREDENTIAL_KEY_FILE: /run/secrets/ozon_credential_key
    OZON_CREDENTIAL_KEY_VERSION: "${OZON_CREDENTIAL_KEY_VERSION:-1}"
    POSTGRES_POOL_MIN_SIZE: "1"
    POSTGRES_POOL_MAX_SIZE: "4"
    REDIS_URL: redis://redis:6379/0
    # Chroma 与 API/Worker 通过受控内部网络通信，不暴露公网；知识检索不可用时由应用降级并明确返回。
    CHROMA_URL: http://chroma:8000
    RAG_EMBEDDING_PROVIDER: "${RAG_EMBEDDING_PROVIDER:-dashscope}"
    RAG_EMBEDDING_BASE_URL: "${RAG_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-text-embedding-v4}"
    RAG_EMBEDDING_DIMENSION: "${RAG_EMBEDDING_DIMENSION:-1024}"
    RAG_TRANSLATION_PROVIDER: "${RAG_TRANSLATION_PROVIDER:-dashscope}"
    RAG_TRANSLATION_BASE_URL: "${RAG_TRANSLATION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    RAG_TRANSLATION_MODEL: "${RAG_TRANSLATION_MODEL:-}"
    RAG_PROVIDER_CREDENTIALS_DIR: /var/lib/ozonslj/rag-providers
    # 当前仅 HTTP 开发节点必须为 false；启用 HTTPS 后发布前改为 true。
    SESSION_COOKIE_SECURE: "false"
    LOGIN_MAX_ATTEMPTS: "5"
    LOGIN_WINDOW_SECONDS: "300"
    WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-5}"
    SYNC_LEASE_SECONDS: "${SYNC_LEASE_SECONDS:-60}"
    SYNC_HEARTBEAT_SECONDS: "${SYNC_HEARTBEAT_SECONDS:-20}"
    OZON_MODE: stub
    LOG_LEVEL: INFO
  secrets:
    - postgres_password
    - ozon_credential_key
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
    - egress

services:
  postgres:
    image: ${REGISTRY_PREFIX}/pxd:postgres-16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    environment:
      POSTGRES_DB: ozonslj
      POSTGRES_USER: ozonslj
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 只绑定服务器回环地址，供本地客户端通过 SSH 隧道访问，禁止公网直连。
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozonslj -d ozonslj"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend
      - tunnel

  redis:
    image: ${REGISTRY_PREFIX}/pxd:redis-7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - backend

  api:
    <<: *app-common
    volumes:
      - ./secrets/rag-providers:/var/lib/ozonslj/rag-providers:rw
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  worker:
    <<: *app-common
    volumes:
      - ./secrets/rag-providers:/var/lib/ozonslj/rag-providers:rw
    command: ["python", "-m", "backend.app.worker"]
    deploy:
      resources:
        limits:
          memory: 192M

  scheduler:
    # Scheduler 只负责把到期任务投递到 Redis；执行和租约续期由独立 Worker 负责。
    # 两者必须分进程，避免 Worker 重启或阻塞时导致到期任务永远无法投递。
    <<: *app-common
    # 调度器只访问 PostgreSQL/Redis，不读取模型或 Seller 凭据；显式清空挂载，
    # 避免某个可选 Secret 缺失时阻断整个调度进程启动。
    environment:
      APP_ENV: production
      SERVICE_ROLE: scheduler
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ozonslj
      POSTGRES_USER: ozonslj
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_URL: redis://redis:6379/0
      DEFAULT_ORGANIZATION_ID: legacy-bootstrap
      LOG_LEVEL: INFO
      SYNC_DISPATCH_INTERVAL_SECONDS: "5"
      SYNC_DISPATCH_BATCH_SIZE: "100"
    volumes: []
    secrets:
      - postgres_password
    command: ["python", "-c", "from backend.app.sync_runtime import scheduler_main; scheduler_main()"]
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    image: ${REGISTRY_PREFIX}/pxd:nginx-1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - backend
      - egress

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  ozon_credential_key:
    file: ./secrets/ozon_credential_key

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    internal: true
  egress:
  tunnel:
